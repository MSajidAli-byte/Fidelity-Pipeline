<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-[#050505]" />
    <title>Fidelity Pipeline - B2B AI Resume Auditor & Generator</title>

    <!-- PWA Primary Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="theme-color" content="#050505" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FidelityResume" />
    <meta name="description" content="Anti-Hallucination & Anti-Cloning B2B Resume Infrastructure with Fact-Checking Auditor." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration for PWA -->
    <script>
      if ('serviceWorker' in navigator && window.location.protocol !== 'file:') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (registration) => {
              console.log('[PWA] ServiceWorker registered with scope:', registration.scope);
            },
            (err) => {
              console.log('[PWA] ServiceWorker registration failed:', err);
            }
          );
        });
      }
    </script>
  </body>
</html>
